[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepend-cover"
version = "0.1.0"
description = "Prepend a cover image to a video."
requires-python = ">=3.9"

[project.scripts]
prepend-cover = "prepend_cover:main"

[tool.setuptools]
py-modules = ["prepend_cover"]
